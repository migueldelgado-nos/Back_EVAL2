services:
  backend:
    build: .
    container_name: innovatech_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: proyecto_db
      DB_PORT: 3306
    depends_on:
      - mysql
    restart: always

  mysql:
    image: mysql:8.0
    container_name: innovatech_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: proyecto_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./01_creacion_base_datos.sql:/docker-entrypoint-initdb.d/01_creacion_base_datos.sql
    restart: always

volumes:
  mysql_data:
